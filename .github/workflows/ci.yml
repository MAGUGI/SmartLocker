name: CI & Preventive Maintenance

on:
  push:
    branches: [main, backend, frontend, development]
  pull_request:
    branches: [main, backend, frontend, development]
  schedule:
    # MNT-13: Verificacao preventiva semanal (segundas-feiras as 06:00 UTC)
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate backup script syntax (MNT-12)
        run: bash -n scripts/backup-db.sh

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/smartlocker"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/smartlocker"
          NEXTAUTH_SECRET: "ci-build-secret-placeholder-32-chars"
          NEXTAUTH_URL: "http://localhost:3000"
